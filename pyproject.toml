[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nemar-metadata"
version = "0.1.0"
description = "Downloads and extracts metadata from the nemarDatasets GitHub organization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hed-metadata-toolkit @ file:///H:/Repos/hed-metadata-toolkit",
    "pandas",
    "requests",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "N802",  # camelCase test methods (legacy convention)
    "N803",  # non-lowercase argument names (scientific code)
    "N806",  # non-lowercase variables in functions (scientific code)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
