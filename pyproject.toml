[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nemar-metadata"
version = "0.1.0"
description = "Downloads and extracts metadata from the nemarDatasets GitHub organization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hed-metadata-toolkit @ file:///H:/Repos/hed-metadata-toolkit",
    "pandas",
    "requests",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
